<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work Hours Timer</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: one time card. Start and length in, leave time stamped out, countdown and alarm beneath. */
  --paper:#e7eae2;
  --card:#f8f9f5;
  --ink:#1a201c;
  --muted:#5d6660;
  --rule:#cad0c4;
  --stamp:#3a3db3;
  --plus:#1d7745;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1211;
    --card:#181c1a;
    --ink:#e4e8e1;
    --muted:#8e9790;
    --rule:#2c332f;
    --stamp:#a5a8ff;
    --plus:#5ec48c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1211;
  --card:#181c1a;
  --ink:#e4e8e1;
  --muted:#8e9790;
  --rule:#2c332f;
  --stamp:#a5a8ff;
  --plus:#5ec48c;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}

.wrap{max-width:520px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.card{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:30px 20px 22px;overflow:hidden}
.card::before{content:"";position:absolute;left:10px;right:10px;top:10px;height:8px;background:radial-gradient(circle,var(--paper) 2.8px,transparent 3.4px) left center/18px 8px repeat-x}

.inputs{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.field{display:grid;gap:4px;min-width:0;align-content:start}
.field label,.field .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;min-width:0;min-height:46px;border:0;border-bottom:2px solid var(--rule);border-radius:0;background:transparent;padding:4px 0 6px;font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.field input:focus,.field input:focus-visible{outline:none;border-bottom-color:var(--stamp)}
.field input::-webkit-date-and-time-value{text-align:left}
.dur{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--rule)}
.dur:focus-within{border-bottom-color:var(--stamp)}
.dur input{border-bottom:0;width:2.1ch;flex:0 0 auto;text-align:right}
.dur input#dur-m{width:2.3ch}
.dur span{font-family:var(--mono);font-size:15px;color:var(--muted);margin-right:6px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.reset{appearance:none;-webkit-appearance:none;background:none;border:0;padding:2px 0;justify-self:start;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.stamp{display:inline-grid;margin:28px 0 0 4px;color:var(--stamp);border:3px double var(--stamp);border-radius:8px;padding:6px 16px 0;transform:rotate(-2.5deg);transform-origin:left bottom}
.stamp-label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.stamp-time{font-family:var(--display);font-stretch:62%;font-weight:800;font-size:clamp(70px,23vw,140px);line-height:.92;font-variant-numeric:tabular-nums}
.stamp.empty{color:var(--muted);border-color:var(--rule)}
.stamp.pressed{animation:press .34s cubic-bezier(.2,.8,.3,1)}
@keyframes press{from{transform:rotate(-2.5deg) scale(1.07)}to{transform:rotate(-2.5deg) scale(1)}}

.sub{display:grid;gap:8px;margin-top:22px}
.sub-main{font-size:20px;font-weight:600;line-height:1.3}
.sub-main.done{color:var(--plus)}
.sub-detail{font-size:14px;color:var(--muted)}
.bar{height:8px;background:var(--rule);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--stamp);border-radius:inherit;transition:width .4s ease}
.bar.done i{background:var(--plus)}

/* Alarm */
.alarm{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--plus);color:var(--card);border-radius:12px;padding:16px 18px}
.alarm strong{font-family:var(--display);font-stretch:72%;font-weight:800;font-size:26px;line-height:1.1}
.alarm.ringing{animation:ring 1s ease-in-out infinite}
@keyframes ring{50%{filter:brightness(1.18)}}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--muted)}

.alerts{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.alerts .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.alerts p{margin:0}

@media (max-width:380px){
  .card{padding:28px 16px 20px}
  .inputs{gap:12px}
  .field input{font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  .stamp.pressed,.alarm.ringing{animation:none}
  .bar i{transition:none}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow" id="today">Today</div>

  <div class="alarm" id="alarm" role="alert" hidden>
    <div><strong id="alarm-title">Time's up</strong><div id="alarm-sub">You can leave now.</div></div>
    <button class="btn" id="alarm-stop" type="button">Stop</button>
  </div>

  <section class="card" aria-label="Leave time">
    <div class="inputs">
      <div class="field">
        <label for="start">Start time</label>
        <input id="start" type="time">
      </div>
      <div class="field">
        <span class="lbl" id="dur-label">Count</span>
        <div class="dur" role="group" aria-labelledby="dur-label">
          <input id="dur-h" type="number" inputmode="numeric" min="0" max="23" aria-label="Hours"><span>h</span>
          <input id="dur-m" type="number" inputmode="numeric" min="0" max="59" aria-label="Minutes"><span>m</span>
        </div>
        <button class="reset" id="dur-reset" type="button" hidden>Back to 9h 10m</button>
      </div>
    </div>

    <div class="stamp empty" id="stamp">
      <span class="stamp-label">Leave at</span>
      <span class="stamp-time" id="leave">--:--</span>
    </div>

    <div class="sub">
      <div class="sub-main" id="sub" aria-live="polite">Enter your start time.</div>
      <div class="bar" id="bar" hidden><i id="fill"></i></div>
      <div class="sub-detail" id="detail"></div>
    </div>
  </section>

  <div class="alerts">
    <p>When the count ends, this page plays a chime and shows an alert. It only works while the page is open on screen.</p>
    <div class="row">
      <button class="btn" id="test" type="button">Test the chime</button>
      <button class="btn" id="notify" type="button" hidden>Also show a notification</button>
    </div>
    <p id="notify-note" hidden></p>
  </div>
</main>

<script>
(function () {
  "use strict";
  var DEFAULT_DUR = 9 * 60 + 10;
  var KEY_DAY = "leavetime.today";
  var KEY_DUR = "leavetime.duration";
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var duration = DEFAULT_DUR;
  var lastLeave = null;
  var firedFor = null;      // "date|leave" that has already rung
  var wasCounting = false;
  var audioCtx = null;
  var ringTimer = null, ringStop = null;

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function toMin(t) {
    var m = /^(\d{1,2}):(\d{2})/.exec(String(t || ""));
    if (!m) return null;
    var h = +m[1], mi = +m[2];
    return (h > 23 || mi > 59) ? null : h * 60 + mi;
  }
  function fmtClock(min) { min = ((Math.round(min) % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ":" + pad(min % 60); }
  function fmtDur(min) {
    min = Math.max(0, Math.round(min));
    var h = Math.floor(min / 60), m = min % 60;
    return h ? h + "h " + pad(m) + "m" : m + "m";
  }
  function nowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; }

  /* ---------- this browser's memory: today's start, preferred length ---------- */
  function store(key, val) { try { if (val == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
  function read(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
  function loadStart() { var o = read(KEY_DAY); return (o && o.date === todayISO() && toMin(o.start) != null) ? o.start : ""; }
  function saveStart(v) { store(KEY_DAY, v ? { date: todayISO(), start: v, fired: firedFor } : null); }

  /* ---------- sound ---------- */
  function unlockAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function chime() {
    if (!audioCtx) return;
    try {
      var t0 = audioCtx.currentTime + 0.02;
      [880, 1175, 1568].forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = f;
        var t = t0 + i * 0.22;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 0.65);
      });
    } catch (e) {}
  }


  /* ---------- tab icon and title (visible when the page is its own tab) ---------- */
  var BASE_TITLE = document.title;
  var flashTimer = null, flashOn = false;
  function cssVar(name, fallback) {
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || fallback; } catch (e) { return fallback; }
  }
  function drawIcon(alert) {
    try {
      var c = document.createElement("canvas"); c.width = c.height = 64;
      var x = c.getContext("2d");
      var bg = alert ? "#d92d20" : cssVar("--stamp", "#3a3db3");
      x.fillStyle = bg;
      x.beginPath(); x.arc(32, 32, 30, 0, Math.PI * 2); x.fill();
      x.fillStyle = "#fff"; x.strokeStyle = "#fff"; x.lineCap = "round";
      if (alert) {
        x.font = "bold 50px Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText("!", 32, 35);
      } else {
        x.lineWidth = 6;
        x.beginPath(); x.moveTo(32, 32); x.lineTo(32, 14); x.stroke();
        x.beginPath(); x.moveTo(32, 32); x.lineTo(45, 39); x.stroke();
      }
      return c.toDataURL("image/png");
    } catch (e) { return null; }
  }
  var ICON_NORMAL = drawIcon(false), ICON_ALERT = drawIcon(true);
  function setIcon(alert) {
    var href = alert ? ICON_ALERT : ICON_NORMAL;
    if (href) $("favicon").href = href;
    document.title = alert ? "! Time's up · " + BASE_TITLE : BASE_TITLE;
  }
  function startFlash() {
    stopFlash(false);
    flashOn = true; setIcon(true);
    flashTimer = setInterval(function () { flashOn = !flashOn; setIcon(flashOn); }, 700);
  }
  function stopFlash(keepAlert) {
    clearInterval(flashTimer); flashTimer = null;
    setIcon(!!keepAlert);
  }
  setIcon(false);

  /* ---------- alarm ---------- */
  function ring(leave) {
    $("alarm-title").textContent = "Time's up · " + fmtClock(leave);
    $("alarm-sub").textContent = "You can leave now.";
    var el = $("alarm");
    el.hidden = false;
    el.classList.add("ringing");
    chime();
    clearInterval(ringTimer); clearTimeout(ringStop);
    ringTimer = setInterval(chime, 3000);
    ringStop = setTimeout(stopRing, 60000);
    startFlash();
    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("Time's up", { body: "Your " + fmtDur(duration) + " ended at " + fmtClock(leave) + ".", tag: "leave-time" });
      }
    } catch (e) {}
  }
  function stopRing() {
    clearInterval(ringTimer); clearTimeout(ringStop);
    ringTimer = ringStop = null;
    $("alarm").classList.remove("ringing");
    if (flashTimer) stopFlash(true);
  }
  function dismiss() { stopRing(); stopFlash(false); $("alarm").hidden = true; }

  /* ---------- render ---------- */
  function render() {
    var start = toMin($("start").value);
    var stamp = $("stamp"), sub = $("sub"), detail = $("detail"), bar = $("bar"), fill = $("fill");

    $("today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    $("dur-reset").hidden = duration === DEFAULT_DUR;
    sub.className = "sub-main"; detail.textContent = ""; bar.hidden = true; bar.classList.remove("done");

    if (start == null || duration <= 0) {
      $("leave").textContent = "--:--";
      stamp.classList.add("empty");
      sub.textContent = start == null ? "Enter your start time." : "Set how long to count.";
      lastLeave = null; wasCounting = false;
      return;
    }

    var leave = start + duration, now = nowMin();
    $("leave").textContent = fmtClock(leave);
    stamp.classList.remove("empty");
    if (lastLeave !== leave) {
      if (lastLeave !== null && !reduceMotion) {
        stamp.classList.remove("pressed");
        void stamp.offsetWidth;
        stamp.classList.add("pressed");
      }
      lastLeave = leave;
    }

    var key = todayISO() + "|" + leave;
    if (now < start) {
      sub.textContent = "Starts in " + fmtDur(Math.ceil(start - now));
      wasCounting = true;
    } else if (now < leave) {
      sub.textContent = fmtDur(Math.ceil(leave - now)) + " to go";
      detail.textContent = "Started " + fmtClock(start) + " · " + fmtDur(Math.floor(now - start)) + " in";
      bar.hidden = false;
      fill.style.width = ((now - start) / duration * 100).toFixed(1) + "%";
      wasCounting = true;
    } else {
      sub.textContent = now - leave < 1 ? "Done. You can leave now." : "Done. You could leave " + fmtDur(Math.floor(now - leave)) + " ago.";
      sub.classList.add("done");
      bar.hidden = false; bar.classList.add("done");
      fill.style.width = "100%";
      // Ring when the count runs out while the page is open, or if it ended in the last 2 minutes.
      if (firedFor !== key && (wasCounting || now - leave < 2)) {
        firedFor = key;
        saveStart($("start").value);
        ring(leave);
      }
      wasCounting = false;
    }
  }

  /* ---------- inputs ---------- */
  function readDuration() {
    var h = parseInt($("dur-h").value, 10), m = parseInt($("dur-m").value, 10);
    if (isNaN(h)) h = 0; if (isNaN(m)) m = 0;
    h = Math.max(0, Math.min(23, h)); m = Math.max(0, Math.min(59, m));
    return h * 60 + m;
  }
  function showDuration() {
    if (document.activeElement !== $("dur-h")) $("dur-h").value = String(Math.floor(duration / 60));
    if (document.activeElement !== $("dur-m")) $("dur-m").value = pad(duration % 60);
  }
  function onDuration(final) {
    duration = readDuration();
    wasCounting = false;
    store(KEY_DUR, duration === DEFAULT_DUR ? null : duration);
    if (final) { $("dur-h").value = String(Math.floor(duration / 60)); $("dur-m").value = pad(duration % 60); }
    render();
  }

  var saved = read(KEY_DUR);
  if (typeof saved === "number" && saved > 0 && saved < 1440) duration = saved;
  var day = read(KEY_DAY);
  if (day && day.date === todayISO() && day.fired) firedFor = day.fired;
  $("start").value = loadStart();
  showDuration();

  function onStart() {
    unlockAudio();
    wasCounting = false;
    var v = toMin($("start").value) == null ? "" : $("start").value;
    saveStart(v);
    render();
  }
  $("start").addEventListener("input", onStart);
  $("start").addEventListener("change", onStart);
  ["dur-h", "dur-m"].forEach(function (id) {
    $(id).addEventListener("input", function () { unlockAudio(); onDuration(false); });
    $(id).addEventListener("change", function () { onDuration(true); });
  });
  $("dur-reset").addEventListener("click", function () { duration = DEFAULT_DUR; store(KEY_DUR, null); showDuration(); render(); });
  $("alarm-stop").addEventListener("click", dismiss);
  $("test").addEventListener("click", function () { unlockAudio(); setTimeout(chime, 60); });
  document.addEventListener("pointerdown", unlockAudio, { passive: true });
  document.addEventListener("keydown", unlockAudio);

  // Browser notifications, where this page is allowed to ask.
  var canNotify = false;
  try { canNotify = "Notification" in window && Notification.permission === "default" && window.isSecureContext; } catch (e) {}
  $("notify").hidden = !canNotify;
  $("notify").addEventListener("click", function () {
    var note = $("notify-note");
    try {
      Promise.resolve(Notification.requestPermission()).then(function (p) {
        $("notify").hidden = true;
        note.hidden = false;
        note.textContent = p === "granted"
          ? "Notifications are on. They show while this page stays open."
          : "Notifications aren't available here, so you'll get the chime and alert only.";
      }, function () {
        $("notify").hidden = true; note.hidden = false;
        note.textContent = "Notifications aren't available here, so you'll get the chime and alert only.";
      });
    } catch (e) {
      $("notify").hidden = true; note.hidden = false;
      note.textContent = "Notifications aren't available here, so you'll get the chime and alert only.";
    }
  });

  var today = todayISO();
  setInterval(function () {
    if (todayISO() !== today) { today = todayISO(); $("start").value = ""; firedFor = null; saveStart(""); dismiss(); }
    render();
  }, 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) render(); });

  render();
})();
</script>
</body>
</html>
